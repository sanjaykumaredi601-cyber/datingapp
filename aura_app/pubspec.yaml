name: aura_app
description: Aura — Privacy-first, location-based dating app.
publish_to: 'none'
version: 1.0.2+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc: ^8.1.4

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  http: ^1.2.0
  crypto: ^3.0.3
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Real-time / Sockets
  socket_io_client: ^2.0.3+1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  camera: ^0.11.0+2

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Firebase & Cloud Database
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Animation
  lottie: ^3.1.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Emoji / GIF
  emoji_picker_flutter: ^4.4.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  dartz: ^0.10.1

  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^8.1.0
  firebase_storage: ^12.4.10
  audioplayers: ^6.7.1
  record: ^6.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  retrofit_generator: ^9.1.6
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080A0F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0B0C10"
  image: assets/icon/app_icon.png
  android_12:
    color: "#0B0C10"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#0B0C10"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
  #       - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700
